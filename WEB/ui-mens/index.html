<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" type="image/png" href="../img/titlelogo.png"/>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <title>DD - Suas Mensagens</title>
</head>
<body>
  <header class="main-header">
    <div class="header-content">
      <div class="nav_logo">Diagnóstico<span>Digital</span></div>
      <nav class="nav-buttons">
        <a href="../ui/index.html"><button>Voltar</button></a>
      </nav>
    </div>
  </header>
  <div id="loginError" class="erro"></div>
  <div class="container">
    <main class="form-wrapper">
      <div id="cardsContainer"></div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
<div id="modalResposta" class="modal">
  <div class="modal-content">
    <span class="close" onclick="fecharModal()">&times;</span>

    <h2>Responder Mensagem</h2>
    <p><strong>ID do Médico:</strong> <span id="modalFromId"></span></p>
    <p><strong>ID do Paciente:</strong> <span id="modalToId"></span></p>
    <textarea id="campoResposta" placeholder="Digite sua resposta aqui..."></textarea>

    <button class="enviar-button" onclick="enviarResposta()">Enviar Resposta</button>
  </div>
</div>
</html>
